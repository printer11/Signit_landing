<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0EE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F4C3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26D0CE;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>

  <!-- Calendar container with shadow -->
  <g filter="url(#shadow)">
    <rect x="150" y="80" width="500" height="440" rx="16" fill="white" stroke="#E5E5E5" stroke-width="2"/>
  </g>

  <!-- Shadow filter -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Calendar header -->
  <rect x="150" y="80" width="500" height="60" rx="16" fill="url(#accentGradient)"/>
  <text x="400" y="120" font-family="Space Grotesk, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">Wrzesień 2026</text>

  <!-- Day labels -->
  <g font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#64748B">
    <text x="200" y="170" text-anchor="middle">PN</text>
    <text x="270" y="170" text-anchor="middle">WT</text>
    <text x="340" y="170" text-anchor="middle">ŚR</text>
    <text x="410" y="170" text-anchor="middle">CZ</text>
    <text x="480" y="170" text-anchor="middle">PT</text>
    <text x="550" y="170" text-anchor="middle">SB</text>
    <text x="620" y="170" text-anchor="middle">ND</text>
  </g>

  <!-- Calendar grid - days -->
  <g font-family="Inter, sans-serif" font-size="16" fill="#2C3E50">
    <!-- Week 1 -->
    <circle cx="200" cy="210" r="20" fill="#F5F5F5"/>
    <text x="200" y="216" text-anchor="middle">1</text>
    <circle cx="270" cy="210" r="20" fill="#F5F5F5"/>
    <text x="270" y="216" text-anchor="middle">2</text>
    <circle cx="340" cy="210" r="20" fill="#F5F5F5"/>
    <text x="340" y="216" text-anchor="middle">3</text>
    <circle cx="410" cy="210" r="20" fill="#F5F5F5"/>
    <text x="410" y="216" text-anchor="middle">4</text>
    <circle cx="480" cy="210" r="20" fill="#F5F5F5"/>
    <text x="480" y="216" text-anchor="middle">5</text>

    <!-- Week 2 -->
    <circle cx="200" cy="270" r="20" fill="#F5F5F5"/>
    <text x="200" y="276" text-anchor="middle">8</text>
    <circle cx="270" cy="270" r="20" fill="#F5F5F5"/>
    <text x="270" y="276" text-anchor="middle">9</text>
    <circle cx="340" cy="270" r="20" fill="#F5F5F5"/>
    <text x="340" y="276" text-anchor="middle">10</text>
    <circle cx="410" cy="270" r="20" fill="#F5F5F5"/>
    <text x="410" y="276" text-anchor="middle">11</text>
    <circle cx="480" cy="270" r="20" fill="#F5F5F5"/>
    <text x="480" y="276" text-anchor="middle">12</text>

    <!-- Week 3 - with SELECTED DAY -->
    <circle cx="200" cy="330" r="20" fill="#F5F5F5"/>
    <text x="200" y="336" text-anchor="middle">15</text>
    <circle cx="270" cy="330" r="20" fill="#F5F5F5"/>
    <text x="270" y="336" text-anchor="middle">16</text>

    <!-- SELECTED DAY - 17th -->
    <circle cx="340" cy="330" r="24" fill="#0F4C3A"/>
    <text x="340" y="336" text-anchor="middle" fill="white" font-weight="700">17</text>

    <circle cx="410" cy="330" r="20" fill="#F5F5F5"/>
    <text x="410" y="336" text-anchor="middle">18</text>
    <circle cx="480" cy="330" r="20" fill="#F5F5F5"/>
    <text x="480" y="336" text-anchor="middle">19</text>

    <!-- Week 4 -->
    <circle cx="200" cy="390" r="20" fill="#F5F5F5"/>
    <text x="200" y="396" text-anchor="middle">22</text>
    <circle cx="270" cy="390" r="20" fill="#F5F5F5"/>
    <text x="270" y="396" text-anchor="middle">23</text>
    <circle cx="340" cy="390" r="20" fill="#F5F5F5"/>
    <text x="340" y="396" text-anchor="middle">24</text>
    <circle cx="410" cy="390" r="20" fill="#F5F5F5"/>
    <text x="410" y="396" text-anchor="middle">25</text>
    <circle cx="480" cy="390" r="20" fill="#F5F5F5"/>
    <text x="480" y="396" text-anchor="middle">26</text>
  </g>

  <!-- Time slot selection -->
  <rect x="150" y="440" width="500" height="80" fill="#F9FAFB" stroke="#E5E5E5" stroke-width="1"/>
  <text x="400" y="468" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">Wybrany termin:</text>
  <text x="400" y="495" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700" fill="#0F4C3A" text-anchor="middle">17 września, 14:00</text>

  <!-- Big checkmark overlay -->
  <g opacity="0.9">
    <circle cx="580" cy="380" r="50" fill="#26D0CE"/>
    <path d="M 560 380 L 575 395 L 600 365" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Arrow from client to calendar (subtle) -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FF6B35" />
    </marker>
  </defs>
  <path d="M 100 150 Q 120 120, 140 100" stroke="#FF6B35" stroke-width="3" fill="none" marker-end="url(#arrowhead)" opacity="0.6"/>
  <circle cx="80" cy="160" r="12" fill="#FF6B35" opacity="0.8"/>
  <text x="80" y="190" font-family="Inter, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Klient</text>
</svg>
